services:
  meetings:
    build: { context: ., dockerfile: Dockerfile }
    image: local/meetings
    container_name: meetings
    restart: unless-stopped
    mem_limit: 2500m
    ports: ["127.0.0.1:8779:8778"]
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - /volume1/docker/meetings/app:/app
      - /volume1/projects/meetings:/data
      - /volume1/docker/backups/meetings:/backup
      - /volume1/docker/meetings/claude-config:/claude-home/.claude
      - /volume1/docker/worker/home/.claude-token:/claude-home/.claude-token:ro
      - /volume1/docker/tgbridge/token:/run/tg/token:ro
      - /volume1/docker/tgbridge/allowed_ids:/run/tg/allowed_ids:ro
      - /volume1/docker/meetings/worker.key:/run/meetings/worker.key:ro
